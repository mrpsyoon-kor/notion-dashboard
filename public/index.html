<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSIT 고객 관리 대시보드</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f8fafc;
    color: #1e293b;
  }
  header {
    background: white;
    border-bottom: 1px solid #e2e8f0;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .meta { font-size: 12px; color: #94a3b8; }
  #refreshBtn {
    background: #1e3a8a; color: white; border: none; padding: 7px 14px;
    border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  #refreshBtn:hover { background: #1e40af; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
  .kpi .num { font-size: 24px; font-weight: 700; }
  .kpi .label { font-size: 12px; color: #64748b; margin-top: 2px; }
  .kpi.warn .num { color: #dc2626; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input[type="text"] {
    flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;
  }
  .chip {
    padding: 6px 12px; border-radius: 999px; border: 1px solid #cbd5e1; background: white;
    font-size: 12px; cursor: pointer; color: #475569;
  }
  .chip.active { background: #1e293b; color: white; border-color: #1e293b; }

  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: white; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; padding: 14px 16px; margin: 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }

  .customer-row { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
  .customer-row:hover { background: #f8fafc; }
  .customer-row.selected { background: #eff6ff; }
  .cname { font-weight: 600; font-size: 14px; }
  .csub { font-size: 12px; color: #64748b; margin-top: 2px; }
  .cinfo { font-size: 12px; color: #334155; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .cinfo span { background: #f1f5f9; padding: 2px 8px; border-radius: 6px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-right: 4px; }
  .badge.expiring { background: #fee2e2; color: #b91c1c; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; font-size: 13px; }
  .detail-grid .d-label { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
  .detail-grid .d-value { font-weight: 500; }
  .detail-grid .full { grid-column: 1 / -1; }

  .worklog-item { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
  .worklog-item .wtop { display: flex; justify-content: space-between; color: #64748b; font-size: 11px; margin-bottom: 4px; }
  .worklog-item .wtag { background: #eef2ff; color: #3730a3; padding: 1px 6px; border-radius: 6px; font-size: 11px; margin-right: 4px; }

  .empty { padding: 24px; text-align: center; color: #94a3b8; font-size: 13px; }
  .loading { padding: 40px; text-align: center; color: #94a3b8; }
  .subtabs { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid #f1f5f9; }
</style>
</head>
<body>

<header>
  <h1>DSIT 고객 관리 대시보드 <span class="meta">· 노션 데이터 실시간 조회</span></h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="meta" id="lastUpdated"></span>
    <button id="refreshBtn">새로고침</button>
  </div>
</header>

<main>
  <div id="loadingState" class="loading">노션에서 데이터를 불러오는 중...</div>

  <div id="content" style="display:none;">
    <div class="kpis">
      <div class="kpi"><div class="num" id="kpiTotal">-</div><div class="label">DSIT 고객</div></div>
      <div class="kpi warn"><div class="num" id="kpiExpiring">-</div><div class="label">계약만료 30일 이내</div></div>
      <div class="kpi"><div class="num" id="kpiWeek">-</div><div class="label">최근 7일 작업건수</div></div>
      <div class="kpi"><div class="num" id="kpiUnlimited">-</div><div class="label">무제한 요금제</div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="업체명, 담당자, 전화번호, 기종 검색" />
    </div>

    <div class="grid">
      <div class="panel">
        <h2><span>고객 목록 (<span id="customerCount">0</span>) · 청구일순</span></h2>
        <div id="customerList"></div>
      </div>

      <div>
        <div class="panel" id="detailPanel" style="display:none;">
          <h2 id="detailTitle">고객 상세정보</h2>
          <div class="detail-grid" id="detailGrid"></div>
        </div>

        <div class="panel">
          <h2 id="worklogTitle">작업일지</h2>
          <div class="subtabs">
            <button class="chip active" data-range="week">최근 1주</button>
            <button class="chip" data-range="month">최근 1개월</button>
            <button class="chip" data-range="all">전체보기</button>
          </div>
          <div id="worklogList"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
let allCustomers = [];
let allWorklogs = [];
let selectedCustomer = null;
let worklogRange = "week";

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const diff = (new Date(dateStr) - new Date()) / 86400000;
  return Math.ceil(diff);
}
function won(n) {
  return typeof n === "number" ? n.toLocaleString() + "원" : "-";
}

async function load(forceRefresh) {
  document.getElementById("loadingState").style.display = "block";
  document.getElementById("content").style.display = "none";
  const res = await fetch("/api/dashboard" + (forceRefresh ? "?refresh=1" : ""));
  const data = await res.json();
  if (data.error) {
    document.getElementById("loadingState").textContent = "오류: " + data.error;
    return;
  }
  allCustomers = data.customers;
  allWorklogs = data.worklogs;
  document.getElementById("lastUpdated").textContent =
    "마지막 갱신: " + new Date(data.fetchedAt).toLocaleString("ko-KR");
  document.getElementById("loadingState").style.display = "none";
  document.getElementById("content").style.display = "block";
  renderKpis();
  renderCustomers();
  renderWorklogs();
}

function renderKpis() {
  document.getElementById("kpiTotal").textContent = allCustomers.length;
  document.getElementById("kpiExpiring").textContent =
    allCustomers.filter((c) => { const d = daysUntil(c.contractEnd); return d !== null && d >= 0 && d <= 30; }).length;
  const weekAgo = Date.now() - 7 * 86400000;
  document.getElementById("kpiWeek").textContent =
    allWorklogs.filter((w) => w.date && new Date(w.date).getTime() >= weekAgo).length;
  document.getElementById("kpiUnlimited").textContent = allCustomers.filter((c) => c.unlimited).length;
}

function renderCustomers() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = allCustomers.filter((c) => {
    if (!q) return true;
    return [c.name, c.contact, c.owner, c.phone, c.model, c.serial]
      .some((v) => (v || "").toLowerCase().includes(q));
  });

  document.getElementById("customerCount").textContent = filtered.length;
  const list = document.getElementById("customerList");
  list.innerHTML = "";

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">조건에 맞는 고객이 없습니다</div>';
    return;
  }

  filtered.forEach((c) => {
    const d = daysUntil(c.contractEnd);
    const row = document.createElement("div");
    row.className = "customer-row" + (selectedCustomer && selectedCustomer.name === c.name ? " selected" : "");
    row.innerHTML = `
      <div class="cname">${c.name || "(이름 없음)"}</div>
      <div class="csub">${c.model || ""} ${c.phone ? "· " + c.phone : ""} ${c.contact ? "· " + c.contact : ""}</div>
      <div class="cinfo">
        <span>청구일 ${c.billingDay || "-"}일</span>
        <span>${won(c.baseFee)}${c.unlimited ? " (무제한)" : ""}</span>
        ${d !== null && d >= 0 && d <= 30 ? `<span class="badge expiring">만료 ${d}일 전</span>` : ""}
      </div>
    `;
    row.onclick = () => {
      selectedCustomer = c;
      renderCustomers();
      renderDetail();
      renderWorklogs();
    };
    list.appendChild(row);
  });
}

function renderDetail() {
  const panel = document.getElementById("detailPanel");
  if (!selectedCustomer) { panel.style.display = "none"; return; }
  panel.style.display = "block";
  const c = selectedCustomer;
  document.getElementById("detailTitle").textContent = c.name + " · 상세정보";

  const rows = [
    ["기종", c.model || "-"],
    ["S/N", c.serial || "-"],
    ["설치일자", c.installDate || "-"],
    ["계약종료일", c.contractEnd || "-"],
    ["기본요금", won(c.baseFee)],
    ["보증금", won(c.deposit)],
    ["무제한 여부", c.unlimited ? "무제한" : "일반"],
    ["청구일", c.billingDay ? c.billingDay + "일" : "-"],
    ["월사용매수(흑백)", c.monthlyBw != null ? c.monthlyBw.toLocaleString() + "매" : "-"],
    ["월사용매수(컬러)", c.monthlyColor != null ? c.monthlyColor.toLocaleString() + "매" : "-"],
    ["청구방식", (c.billingMethod || []).join(", ") || "-"],
    ["VAT 여부", c.vatStatus || "-"],
    ["대표자", c.owner || "-"],
    ["담당자", c.contact || "-"],
    ["전화번호", c.phone || "-"],
    ["이메일", c.email || "-"],
  ];

  document.getElementById("detailGrid").innerHTML = rows.map(([label, value]) => `
    <div>
      <div class="d-label">${label}</div>
      <div class="d-value">${value}</div>
    </div>
  `).join("") + (c.address ? `<div class="full"><div class="d-label">주소</div><div class="d-value">${c.address}</div></div>` : "")
    + (c.note ? `<div class="full"><div class="d-label">비고</div><div class="d-value">${c.note}</div></div>` : "");
}

function renderWorklogs() {
  const title = document.getElementById("worklogTitle");
  const list = document.getElementById("worklogList");

  let items = allWorklogs.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  if (selectedCustomer) {
    items = items.filter((w) => w.customerName === selectedCustomer.name);
  }

  if (worklogRange === "week") {
    const cutoff = Date.now() - 7 * 86400000;
    items = items.filter((w) => w.date && new Date(w.date).getTime() >= cutoff);
  } else if (worklogRange === "month") {
    const cutoff = Date.now() - 30 * 86400000;
    items = items.filter((w) => w.date && new Date(w.date).getTime() >= cutoff);
  }
  // "all"은 필터 없음

  title.textContent = selectedCustomer ? selectedCustomer.name + " 작업일지" : "작업일지 (전체 고객)";

  list.innerHTML = "";
  if (items.length === 0) {
    list.innerHTML = '<div class="empty">해당 기간에 작업 기록이 없습니다</div>';
    return;
  }

  items.forEach((w) => {
    const div = document.createElement("div");
    div.className = "worklog-item";
    div.innerHTML = `
      <div class="wtop"><span>${w.customerName || ""}</span><span>${w.date || ""}</span></div>
      <div>${(w.tasks || []).map((t) => `<span class="wtag">${t}</span>`).join("")} ${w.category ? `<span class="wtag">${w.category}</span>` : ""}</div>
      ${w.memo ? `<div style="margin-top:4px; color:#475569;">${w.memo}</div>` : ""}
      ${w.pic ? `<div style="margin-top:4px; color:#94a3b8; font-size:11px;">담당: ${w.pic}</div>` : ""}
    `;
    list.appendChild(div);
  });
}

document.getElementById("refreshBtn").onclick = () => load(true);
document.getElementById("searchInput").addEventListener("input", renderCustomers);
document.querySelectorAll(".subtabs .chip").forEach((chip) => {
  chip.onclick = () => {
    document.querySelectorAll(".subtabs .chip").forEach((c) => c.classList.remove("active"));
    chip.classList.add("active");
    worklogRange = chip.dataset.range;
    renderWorklogs();
  };
});

load(false);
</script>
</body>
</html>
